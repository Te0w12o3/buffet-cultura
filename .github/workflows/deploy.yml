# Configuración para hacer deploy en GitHub Pages
name: Deploy to GitHub Pages

on:
  # Se ejecuta cada vez que hacemos un push a la rama master/main
  push:
    branches: ["master", "main"]
  # Permite ejecutarlo manualmente
  workflow_dispatch:

# Otorga permisos a GitHub Actions para modificar las Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue concurrente a la vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Trabajo de construcción (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Instalar dependencias
        run: npm ci
        
      - name: Construir proyecto
        run: npm run build
        
      - name: Subir artefactos
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Trabajo de despliegue (Deploy)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
